# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = ["frame", "kernel", "xtask"]
# A plain `cargo build` / `cargo test` in the repository root only touches the host tool.
# The kernel needs `--target x86_64-unknown-none`, and `cargo xtask` passes it for us.
default-members = ["xtask"]

[workspace.package]
edition = "2024"
version = "0.0.0"
repository = "https://github.com/Kocurowy96/OchraOS"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
