#
# Stage 0 "Done when": the kernel boots in QEMU and prints its log; CI boots it headless and
# checks the log. Actions are pinned by commit SHA (Dependabot keeps them up to date).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --package xtask -- -D warnings
      - run: cargo clippy --package kernel --target x86_64-unknown-none -- -D warnings
      - run: >-
          cargo clippy --package kernel --target x86_64-unknown-none --features selftest
          -- -D warnings

  test:
    name: build and boot test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install QEMU, OVMF and the tools to build Limine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf nasm mtools
      # GitHub's Linux runners support KVM, but /dev/kvm is not accessible by default.
      # Without it QEMU falls back to plain emulation, which also works, just slower.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: rustup toolchain install
      - name: Cache the Limine build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/limine
          key: limine-${{ runner.os }}-${{ hashFiles('xtask/src/limine.rs') }}
      - run: cargo xtask build
      - run: cargo xtask test
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs
          path: |
            build/test-*.log
            build/limine/build.log
          if-no-files-found: ignore

  dco:
    name: Signed-off-by check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit
        env:
          RANGE: >-
            ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || format('{0}..{1}', github.event.before, github.sha) }}
        run: .github/scripts/check-dco.sh "$RANGE"
