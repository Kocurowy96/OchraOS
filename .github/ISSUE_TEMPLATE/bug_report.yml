name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, do not use this form — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Boot with `cargo xtask run`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From `/etc/os-release`, or the commit hash if you built it yourself
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options:
        - Built from source
        - Nightly
        - Beta
        - Stable
    validations:
      required: true
  - type: dropdown
    id: machine
    attributes:
      label: Machine
      options:
        - QEMU
        - Real hardware
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU and laptop or board model (real hardware only)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial log or crash report. It will be formatted as code.
      render: text
