#
# Pinned toolchain: everyone (and CI) builds with exactly this compiler.
# Stable is enough for stage 0 — `#[unsafe(naked)]` functions (used later for interrupt
# entry stubs) have been stable since Rust 1.88, so we do not need nightly.

[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-none"]
