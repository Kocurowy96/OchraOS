#
# Limine configuration, copied to /boot/limine/limine.conf in the boot image.
# `cargo xtask test` appends a `cmdline:` line to the entry to select a kernel self-test.
# Syntax: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

# Boot the first entry straight away, without showing the menu.
timeout: 0

/OchraOS
    protocol: limine
    path: boot():/boot/kernel
