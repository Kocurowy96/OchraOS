# SPDX-License-Identifier: GPL-2.0-only

[package]
name = "kernel"
description = "The OchraOS kernel"
license = "GPL-2.0-only"
edition.workspace = true
version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kernel"
# There is no standard library on bare metal, so there is no test harness either.
# Kernel tests run by booting in QEMU (`cargo xtask test`).
test = false
bench = false

[features]
# Built-in self-tests, chosen with `test=<name>` on the kernel command line; used by
# `cargo xtask test`. Only allowed in debug builds (see `src/selftest.rs`).
selftest = ["ochra-frame/selftest"]

[dependencies]
log = { version = "0.4", default-features = false }
ochra-frame = { path = "../frame" }

[lints]
workspace = true
