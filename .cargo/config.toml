# `cargo xtask <cmd>` is just a shortcut for running the helper binary in `xtask/`.
# This is the "xtask" pattern: build logic written in Rust instead of shell scripts or make.
[alias]
xtask = "run --quiet --package xtask --"

# The kernel is built as a position-independent executable (the default for the
# x86_64-unknown-none target): Limine relocates it to a random address at every boot (KASLR,
# `kaslr: yes` in xtask/limine.conf).
